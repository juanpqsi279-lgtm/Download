name: Build and Release !Download

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv\Scripts\python.exe -e ".[dev]"

      - name: Download portable FFmpeg and Deno
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path bin, _tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile "_tmp\ffmpeg.zip"
          Expand-Archive -Path "_tmp\ffmpeg.zip" -DestinationPath "_tmp\ffmpeg" -Force
          Copy-Item (Get-ChildItem "_tmp\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName "bin\ffmpeg.exe" -Force
          Copy-Item (Get-ChildItem "_tmp\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1).FullName "bin\ffprobe.exe" -Force

          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "_tmp\deno.zip"
          Expand-Archive -Path "_tmp\deno.zip" -DestinationPath "_tmp\deno" -Force
          Copy-Item (Get-ChildItem "_tmp\deno" -Recurse -Filter "deno.exe" | Select-Object -First 1).FullName "bin\deno.exe" -Force
          Remove-Item "_tmp" -Recurse -Force

      - name: Run unit tests
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe -v

      - name: Build !Download executable
        shell: pwsh
        run: |
          .\.venv\Scripts\pyinstaller.exe --noconfirm --clean build.spec
          $p = Start-Process -FilePath ".\dist\!Download\!Download.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }

      - name: Upload unsigned !Download.exe for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-exe
          path: dist/!Download/!Download.exe

      - name: Sign !Download.exe with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'download' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-exe

      - name: Apply signed !Download.exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $outDir = "dist\signpath-exe"
          $zip = Get-ChildItem $outDir -Recurse -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Expand-Archive -Path $zip.FullName -DestinationPath "$outDir\_extracted" -Force
          }
          $signedExe = Get-ChildItem $outDir -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $signedExe) { throw "Signed executable not found in $outDir" }
          Copy-Item $signedExe.FullName "dist\!Download\!Download.exe" -Force
          Remove-Item $outDir -Recurse -Force

      - name: Build installer and portable archive
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v1.3.0" }
          $certPath = $null
          $signtool = $null
          $useLocalCert = [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -and (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64))
          if ($useLocalCert) {
            $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if ($signtool) {
              & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\!Download\!Download.exe"
            }
          }
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = if ($isccCmd) { $isccCmd.Source } else { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if ($iscc -and (Test-Path $iscc)) {
            & $iscc installer.iss
          }
          if ($useLocalCert -and $certPath -and $signtool) {
            Get-ChildItem "dist\*.exe" | ForEach-Object {
              & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "dist\!Download" -DestinationPath "dist\!Download-Portable-$tag.zip" -Force

      - name: Upload unsigned Windows installer for SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-installer
          path: dist/!Download-Setup-*.exe

      - name: Sign Windows installer with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'download' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-installer

      - name: Apply signed Windows installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $outDir = "dist\signpath-installer"
          $zip = Get-ChildItem $outDir -Recurse -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Expand-Archive -Path $zip.FullName -DestinationPath "$outDir\_extracted" -Force
          }
          $signedInstaller = Get-ChildItem $outDir -Recurse -Filter "*.exe" | Select-Object -First 1
          $targetInstaller = Get-ChildItem "dist\!Download-Setup-*.exe" | Select-Object -First 1
          if (-not $signedInstaller -or -not $targetInstaller) {
            throw "Missing signed installer ($signedInstaller) or target installer ($targetInstaller)"
          }
          Copy-Item $signedInstaller.FullName $targetInstaller.FullName -Force
          Remove-Item $outDir -Recurse -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgbm1 libnss3 libnspr4 libasound2t64 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libdbus-1-3 libfontconfig1 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            dpkg xz-utils curl unzip

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Bootstrap dependencies and portable binaries
        run: |
          chmod +x scripts/bootstrap.sh scripts/build_linux_packages.sh download-desktop.sh start.sh
          ./scripts/bootstrap.sh --dev

      - name: Run unit tests
        run: |
          .venv/bin/pytest -v

      - name: Build Linux packages (.AppImage, .deb, .tar.gz)
        run: |
          ./scripts/build_linux_packages.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Android unit tests
        run: gradle -p android testDebugUnitTest

      - name: Build Android release APKs
        run: gradle -p android assembleRelease

      - name: Package Android APK artifacts
        run: |
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          if [[ "$TAG" != v* ]]; then TAG="v1.3.0"; fi
          mkdir -p dist
          ARM64_APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          UNIV_APK=$(find android/app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          if [ -z "$ARM64_APK" ] || [ -z "$UNIV_APK" ]; then
            echo "Missing expected APK outputs"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          cp "$ARM64_APK" "dist/Download-${TAG}-android-arm64.apk"
          cp "$UNIV_APK" "dist/Download-${TAG}-android-universal.apk"
          ls -lh dist/*.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/*.apk

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift MediaParser unit tests
        run: |
          swiftc ios/App/Sources/MediaParser.swift ios/Tests/run_parser_tests.swift -o /tmp/parser_tests
          /tmp/parser_tests

      - name: Sync web assets and generate Xcode project
        run: |
          mkdir -p ios/App/WebAssets/static
          cp static/index.html static/styles.css static/app.js static/icon.png static/manifest.webmanifest ios/App/WebAssets/static/
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build iOS app bundle (Release)
        run: |
          xcodebuild \
            -project ios/ExclaimDownload.xcodeproj \
            -scheme ExclaimDownload \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package .ipa archive
        run: |
          TAG="${GITHUB_REF_NAME:-v1.3.0}"
          if [[ "$TAG" != v* ]]; then TAG="v1.3.0"; fi
          APP_BUNDLE="ios/build/DerivedData/Build/Products/Release-iphoneos/ExclaimDownload.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "Missing ExclaimDownload.app"
            exit 1
          fi
          if [ ! -d "$APP_BUNDLE/python" ]; then
            echo "Missing embedded Python runtime inside ExclaimDownload.app/python"
            ls -la "$APP_BUNDLE"
            exit 1
          fi
          mkdir -p ios/build/ipa/Payload dist
          cp -R "$APP_BUNDLE" ios/build/ipa/Payload/
          (cd ios/build/ipa && zip -qr "../../../dist/Download-${TAG}-ios.ipa" Payload)
          ls -lh dist/*.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-dist
          path: dist/*.ipa

  release:
    needs: [build-windows, build-linux, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-dist"
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
