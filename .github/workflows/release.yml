name: Build and Release !Download

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv\Scripts\python.exe -e ".[dev]"

      - name: Download portable FFmpeg and Deno
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path bin, _tmp | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile "_tmp\ffmpeg.zip"
          Expand-Archive -Path "_tmp\ffmpeg.zip" -DestinationPath "_tmp\ffmpeg" -Force
          Copy-Item (Get-ChildItem "_tmp\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName "bin\ffmpeg.exe" -Force
          Copy-Item (Get-ChildItem "_tmp\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1).FullName "bin\ffprobe.exe" -Force

          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "_tmp\deno.zip"
          Expand-Archive -Path "_tmp\deno.zip" -DestinationPath "_tmp\deno" -Force
          Copy-Item (Get-ChildItem "_tmp\deno" -Recurse -Filter "deno.exe" | Select-Object -First 1).FullName "bin\deno.exe" -Force
          Remove-Item "_tmp" -Recurse -Force

      - name: Run unit tests
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe -v

      - name: Build !Download executable
        shell: pwsh
        run: |
          .\.venv\Scripts\pyinstaller.exe --noconfirm --clean build.spec
          $p = Start-Process -FilePath ".\dist\!Download\!Download.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-check failed with exit code $($p.ExitCode)" }

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = if ($isccCmd) { $isccCmd.Source } else { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if ($iscc -and (Test-Path $iscc)) {
            & $iscc installer.iss
          }
          Compress-Archive -Path "dist\!Download" -DestinationPath "dist\!Download-Portable-$tag.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgbm1 libnss3 libnspr4 libasound2t64 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libdbus-1-3 libfontconfig1 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            dpkg xz-utils curl unzip

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Bootstrap dependencies and portable binaries
        run: |
          chmod +x scripts/bootstrap.sh scripts/build_linux_packages.sh download-desktop.sh start.sh
          ./scripts/bootstrap.sh --dev

      - name: Run unit tests
        run: |
          .venv/bin/pytest -v

      - name: Build Linux packages (.AppImage, .deb, .tar.gz)
        run: |
          ./scripts/build_linux_packages.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
