name: ExclaimDownload
options:
  bundleIdPrefix: com.juancorporation
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

packages:
  ytdlp-apple:
    url: https://github.com/Catlyn-Lab/ytdlp-apple.git
    from: "0.1.1"

targets:
  ExclaimDownload:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/WebAssets
        type: folder
    settings:
      base:
        PRODUCT_NAME: ExclaimDownload
        PRODUCT_BUNDLE_IDENTIFIER: com.juancorporation.exclaimdownload
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "10300"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    dependencies:
      - package: ytdlp-apple
        product: YTDLP
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
      - sdk: JavaScriptCore.framework
    postBuildScripts:
      - name: Install Python for yt-dlp
        script: '"${BUILD_DIR%/Build/*}/SourcePackages/checkouts/ytdlp-apple/scripts/install-python.sh"'
        basedOnDependencyAnalysis: false
